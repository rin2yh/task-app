name: Merge Gate

# Aggregates the conclusion of path-scoped CI workflows into a single required
# status check. Branch protection should require only this workflow's `gate`
# job; downstream workflows (Web CI / Terraform CI / Actions CI) must NOT be
# listed as required, because their `paths:` filters mean they don't always run.
#
# The gate observes which workflows GitHub actually triggered for this PR via
# the actions/runs API — it does not reimplement the `paths:` filters. So a
# workflow that didn't trigger is treated as "skipped (not required)".

on:
  pull_request:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Wait for required workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          KNOWN=("Web CI" "Terraform CI" "Actions CI")
          names_json=$(printf '%s\n' "${KNOWN[@]}" | jq -Rn '[inputs]')

          fetch_states() {
            gh api \
              "repos/${GH_REPO}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" \
            | jq -r --argjson names "$names_json" '
                .workflow_runs
                | map(select(.name | IN($names[])))
                | group_by(.name)
                | map(max_by(.run_started_at))
                | .[]
                | [.name, .status, (.conclusion // "")] | @tsv'
          }

          # The gate's own job can start before its siblings register in the
          # API, so retry discovery briefly before concluding "none triggered".
          states=""
          required=()
          for attempt in 1 2 3 4; do
            states=$(fetch_states)
            required=()
            while IFS=$'\t' read -r name _ _; do
              [[ -n "$name" ]] && required+=("$name")
            done <<<"$states"
            (( ${#required[@]} > 0 )) && break
            (( attempt < 4 )) && sleep 5
          done

          if (( ${#required[@]} == 0 )); then
            echo "### Merge Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "No CI workflows triggered for this PR — gate passes." >> "$GITHUB_STEP_SUMMARY"
            echo "No CI workflows triggered for this PR; gate passes."
            exit 0
          fi

          {
            echo "### Merge Gate"
            echo "Required workflows (observed): ${required[*]}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Required workflows: ${required[*]}"

          deadline=$(( $(date +%s) + 25 * 60 ))
          interval=20

          while :; do
            pending=()
            failed=()
            while IFS=$'\t' read -r name status conclusion; do
              if [[ "$status" != "completed" ]]; then
                pending+=("$name [$status]")
              elif [[ "$conclusion" != "success" && "$conclusion" != "skipped" ]]; then
                failed+=("$name [$conclusion]")
              fi
            done <<<"$states"

            if (( ${#pending[@]} == 0 )); then
              if (( ${#failed[@]} > 0 )); then
                echo "::error::Required workflows failed: ${failed[*]}"
                exit 1
              fi
              echo "All required workflows succeeded."
              exit 0
            fi

            echo "pending=(${pending[*]}) failed=(${failed[*]})"

            if (( $(date +%s) >= deadline )); then
              break
            fi
            sleep "$interval"
            states=$(fetch_states)
          done

          echo "::error::Timed out waiting for required workflows."
          exit 1
