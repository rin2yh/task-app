name: Merge Gate

# Aggregates the conclusion of path-scoped CI workflows into a single required
# status check. Branch protection should require only this workflow's `gate`
# job; downstream workflows (Web CI / Terraform CI / Actions CI) must NOT be
# listed as required, because their `paths:` filters mean they don't always run.
#
# The gate observes which workflows GitHub actually triggered for this PR via
# the actions/runs API — it does not reimplement the `paths:` filters. So a
# workflow that didn't trigger is treated as "skipped (not required)".

on:
  pull_request:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Wait for required workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Workflows that gate merging when triggered. To add another blocker,
        # append its `name:` here. Workflows not in this list never block.
        run: |
          set -euo pipefail

          KNOWN=("Web CI" "Terraform CI" "Actions CI")

          # GitHub registers all workflow runs from one event nearly together,
          # but the gate's own job can start a few seconds before its siblings
          # appear in the API. Sleep briefly so the initial snapshot is stable.
          sleep 20

          runs_json=$(gh api \
            "repos/${GH_REPO}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100")

          required=()
          for name in "${KNOWN[@]}"; do
            count=$(jq --arg n "$name" \
              '[.workflow_runs[] | select(.name == $n)] | length' \
              <<<"$runs_json")
            if (( count > 0 )); then
              required+=("$name")
            fi
          done

          {
            echo "### Merge Gate"
            if [[ ${#required[@]} -eq 0 ]]; then
              echo "No CI workflows triggered for this PR — gate passes."
            else
              echo "Required workflows (observed): ${required[*]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ${#required[@]} -eq 0 ]]; then
            echo "No CI workflows triggered for this PR; gate passes."
            exit 0
          fi

          echo "Required workflows: ${required[*]}"

          deadline=$(( $(date +%s) + 25 * 60 ))
          interval=20

          while [[ $(date +%s) -lt $deadline ]]; do
            runs_json=$(gh api \
              "repos/${GH_REPO}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100")

            pending=()
            failed=()

            for name in "${required[@]}"; do
              latest=$(jq --arg n "$name" \
                '[.workflow_runs[] | select(.name == $n)]
                 | sort_by(.run_started_at) | reverse | .[0]' \
                <<<"$runs_json")
              status=$(jq -r '.status' <<<"$latest")
              conclusion=$(jq -r '.conclusion // ""' <<<"$latest")
              if [[ "$status" != "completed" ]]; then
                pending+=("$name [$status]")
              elif [[ "$conclusion" != "success" && "$conclusion" != "skipped" ]]; then
                failed+=("$name [$conclusion]")
              fi
            done

            printf 'pending=(%s) failed=(%s)\n' \
              "${pending[*]:-}" "${failed[*]:-}"

            if [[ ${#pending[@]} -eq 0 ]]; then
              if [[ ${#failed[@]} -gt 0 ]]; then
                echo "::error::Required workflows failed: ${failed[*]}"
                exit 1
              fi
              echo "All required workflows succeeded."
              exit 0
            fi

            sleep "$interval"
          done

          echo "::error::Timed out waiting for required workflows."
          exit 1
