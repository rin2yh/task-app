name: Merge Gate

# Aggregates the conclusion of path-scoped CI workflows into a single required
# status check. Branch protection should require only this workflow's `gate`
# job; downstream workflows (Web CI / Terraform CI / Actions CI) must NOT be
# listed as required, because their `paths:` filters mean they don't always run.

on:
  pull_request:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - run: .github/scripts/merge-gate.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
