name: Terraform CD

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-apply.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        default: production
        options:
          - production
          - develop

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # Terraform S3 backend が読む env 名は AWS_* 固定。secret 名は R2 の発行画面に
  # 揃えて Cloudflare 系で統一する。
  AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}

jobs:
  apply:
    name: apply ${{ matrix.environment }}
    # `if:` 文脈では `matrix` を参照できないため、matrix 自体を inputs から動的に組み立てて
    # workflow_dispatch のときだけ対象 env に絞り込む。push では両 env が並走する。
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.environment && format('["{0}"]', inputs.environment) || '["production","develop"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # infra と app の Deployments を分けるため -infra サフィックスの environment を使う。
    environment: ${{ matrix.environment }}-infra
    concurrency:
      group: terraform-apply-${{ matrix.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1
      - uses: ./.github/actions/terraform-init
        with:
          bucket: ${{ secrets.CLOUDFLARE_R2_TFSTATE_BUCKET }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: terraform workspace select
        if: matrix.environment != 'production'
        run: terraform workspace select -or-create ${{ matrix.environment }}
      - name: terraform apply
        run: terraform apply -auto-approve
