name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-apply.yml'
  workflow_dispatch:

concurrency:
  group: terraform-apply
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_github_client_id: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
  TF_VAR_github_client_secret: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
  TF_VAR_session_secret: ${{ secrets.SESSION_SECRET }}
  TF_VAR_app_url: ${{ secrets.APP_URL }}
  TF_VAR_preview_github_client_id: ${{ secrets.PREVIEW_OAUTH_GITHUB_CLIENT_ID }}
  TF_VAR_preview_github_client_secret: ${{ secrets.PREVIEW_OAUTH_GITHUB_CLIENT_SECRET }}
  TF_VAR_preview_session_secret: ${{ secrets.PREVIEW_SESSION_SECRET }}
  TF_VAR_preview_app_url: ${{ secrets.PREVIEW_APP_URL }}
  # Terraform S3 backend が読む env 名は AWS_* 固定。secret 名は R2 の発行画面に
  # 揃えて Cloudflare 系で統一する。
  AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1
      - uses: ./.github/actions/terraform-init
        with:
          bucket: ${{ secrets.CLOUDFLARE_R2_TFSTATE_BUCKET }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: terraform apply
        run: terraform apply -auto-approve
