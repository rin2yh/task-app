name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-apply.yml'
  workflow_dispatch:

# production / develop は同 state bucket / 別 workspace なので、両方 apply を直列化する。
concurrency:
  group: terraform-apply
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  # Cloudflare 系・OAuth はアカウント共有のため repo secret 配下。
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_github_client_id: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
  TF_VAR_github_client_secret: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
  # SESSION_SECRET / APP_URL は environment(production|develop) ごとに別値。
  TF_VAR_session_secret: ${{ secrets.SESSION_SECRET }}
  TF_VAR_app_url: ${{ secrets.APP_URL }}
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY は terraform-init action 内で
  # CLOUDFLARE_API_TOKEN から派生する（R2 S3 互換認証は token id と SHA-256(value) で成立）。

jobs:
  apply-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1
      - uses: ./.github/actions/terraform-init
        with:
          bucket: ${{ secrets.CLOUDFLARE_R2_TFSTATE_BUCKET }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: terraform workspace select
        run: terraform workspace select -or-create default
      - name: terraform apply
        run: terraform apply -auto-approve

  apply-develop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [apply-production]
    environment: develop
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1
      - uses: ./.github/actions/terraform-init
        with:
          bucket: ${{ secrets.CLOUDFLARE_R2_TFSTATE_BUCKET }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: terraform workspace select
        run: terraform workspace select -or-create develop
      - name: terraform apply
        run: terraform apply -auto-approve
