name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, test:workers]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm ${{ matrix.task }}

  # Runs Playwright only against tests affected by files changed in the PR
  # (see --only-changed below). Triggered on pull_request, so PR context is implicit.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [check]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('app/pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Stage .dev.vars for E2E
        run: cp .dev.vars.example .dev.vars
      - name: Apply D1 migrations (local)
        run: pnpm db:migrate:local
      - name: Playwright
        run: pnpm exec playwright test --only-changed=${{ github.event.pull_request.base.sha }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [check]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm build
