name: Deploy develop

# main の最新を develop env に追従させる。手動実行(workflow_dispatch)で任意のタイミングでも適用可能。
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-develop.yml'
      - '.github/actions/setup/**'
      - '.github/actions/setup-e2e/**'
  workflow_dispatch:

concurrency:
  group: deploy-develop
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-e2e
      - name: Playwright
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report-develop
          path: app/playwright-report/
          retention-days: 14

  migrate-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [e2e]
    environment: develop
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm exec wrangler d1 migrations apply task-app-develop --remote --env develop

  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [migrate-db]
    environment: develop
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # @cloudflare/vite-plugin が読む。dist/.../wrangler.json を env.develop
      # 反映で生成しないと、wrangler deploy は top-level config を使ってしまう。
      CLOUDFLARE_ENV: develop
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm exec wrangler deploy --env develop
