name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
      - '.github/actions/setup/**'
      - '.github/actions/setup-e2e/**'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  e2e-full:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-e2e
      - name: Playwright (full)
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report-full
          path: app/playwright-report/
          retention-days: 14

  migrate-db:
    runs-on: ubuntu-24.04
    needs: [e2e-full]
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate:prod

  deploy:
    runs-on: ubuntu-24.04
    needs: [migrate-db]
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # @cloudflare/vite-plugin が読む。dist/.../wrangler.json を env.production
      # 反映で生成しないと、wrangler deploy は top-level config (task-app-local) を使ってしまう。
      CLOUDFLARE_ENV: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm exec wrangler deploy --env production
