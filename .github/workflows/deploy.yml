name: Web CD

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/_deploy.yml'
      - '.github/actions/setup/**'
      - '.github/actions/setup-e2e/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        default: develop
        options:
          - develop
          - production

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-e2e
      - name: Playwright
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 14

  deploy:
    name: ${{ matrix.environment }}
    needs: [e2e]
    # `if:` 文脈では `matrix` を参照できないため、matrix 自体を inputs から動的に組み立てて
    # workflow_dispatch のときだけ対象 env に絞り込む。push では両 env が並走する。
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.environment && format('["{0}"]', inputs.environment) || '["production","develop"]') }}
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: ${{ matrix.environment }}
    secrets: inherit
