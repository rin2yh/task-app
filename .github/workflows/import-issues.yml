name: Import Issues (manual)

# GitHub Projects v2 → task-app importer (PR #2 で追加された
# `app/scripts/import-issues.ts`) を、選択した remote D1 に対して
# 手動で 1 回だけ走らせるためのワークフロー。
#
# 統制:
#   - `task_project (imported)` プロジェクトが target D1 に既に存在する
#     場合は全工程を skip する (重複 column / task の生成を防ぐ)。
#   - `environment:` で本番 secret を保護し、必要なら Required reviewers
#     を GitHub 側で付ける。
#
# 前提:
#   - PR #2 マージ後、`pnpm import:issues` が
#     `--remote / --env / --binding` を解釈すること
#     (現状 `--local` ハードコードなので最小拡張が必要)。
#   - Projects v2 read 権限を持つ PAT を `PROJECTS_READ_TOKEN` として
#     リポジトリ secret に登録すること。

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        default: develop
        options:
          - develop
          - production
      project_number:
        description: GitHub Projects v2 number to import from
        type: string
        required: true
      project_owner:
        description: Project owner (org or user). Empty = repository owner.
        type: string
        required: false
        default: ''
      user_login:
        description: Owner GitHub login (must already exist in target users table)
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: import-issues-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: ${{ inputs.environment }}
      # production の D1 名だけ既存リソース互換のため非対称 ("task-app-prod")。
      # _deploy.yml と同じ式で揃える。
      D1_NAME: task-app-${{ inputs.environment == 'production' && 'prod' || inputs.environment }}
      GH_TOKEN: ${{ secrets.PROJECTS_READ_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup

      # 統制 (idempotency): target D1 に同名 project が既にあれば全工程 skip。
      # importer 側の重複防止 (--force なしで即終了) と同じ条件をワークフロー
      # 入口にも置くことで、CI 上で誤って 2 回押しても副作用ゼロにする。
      - name: Check existing import
        id: check
        run: |
          set -euo pipefail
          out=$(pnpm exec wrangler d1 execute "$D1_NAME" \
            --remote --env "$CLOUDFLARE_ENV" \
            --json \
            --command "SELECT COUNT(*) AS c FROM projects WHERE name='task_project (imported)';")
          count=$(printf '%s' "$out" | jq -r '.[0].results[0].c // 0')
          echo "existing project rows: $count"
          if [ "$count" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.check.outputs.skip == 'true'
        run: echo "::notice::task_project (imported) already exists in ${CLOUDFLARE_ENV}. Skipping import."

      - name: Fetch GH project items
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p tmp
          owner="${{ inputs.project_owner }}"
          if [ -z "$owner" ]; then owner="${{ github.repository_owner }}"; fi
          gh project item-list "${{ inputs.project_number }}" \
            --owner "$owner" \
            --format json \
            --limit 1000 \
            > tmp/project-items.json

      - name: Run importer
        if: steps.check.outputs.skip != 'true'
        run: |
          pnpm import:issues \
            --user-login "${{ inputs.user_login }}" \
            --remote \
            --env "$CLOUDFLARE_ENV" \
            --binding "$D1_NAME"
