name: Import Issues (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        default: develop
        options:
          - develop
          - production

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: import-issues-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: ${{ inputs.environment }}
      # production の D1 名だけ既存リソース互換のため非対称 ("task-app-prod")。
      # _deploy.yml と同じ式で揃える。
      D1_NAME: task-app-${{ inputs.environment == 'production' && 'prod' || inputs.environment }}
      GH_TOKEN: ${{ secrets.PROJECTS_READ_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup

      # PROJECTS_READ_TOKEN が未設定だと `gh project item-list` が exit 4 (auth 失敗) で
      # 落ちるが、ログだけだと「token がない」のか「scope が足りない」のか分からない。
      # 入口で secret 自体の有無だけ先に判定し、未設定ならどこに何を登録するかを明示する。
      - name: Verify PROJECTS_READ_TOKEN is set
        env:
          HAS_TOKEN: ${{ secrets.PROJECTS_READ_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::secrets.PROJECTS_READ_TOKEN is not configured. Create a PAT with 'read:project' scope (classic) or 'Projects: Read' permission (fine-grained), then add it at Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      # importer 自身の重複チェック (--force なしで即終了) と同じ条件をワークフロー
      # 入口にも置く。CI 上で誤って 2 回押されても重複 column / task が生成されない。
      - name: Check existing import
        id: check
        run: |
          set -euo pipefail
          out=$(pnpm exec wrangler d1 execute "$D1_NAME" \
            --remote --env "$CLOUDFLARE_ENV" \
            --json \
            --command "SELECT COUNT(*) AS c FROM projects WHERE name='task_project (imported)';")
          count=$(printf '%s' "$out" | jq -r '.[0].results[0].c // 0')
          echo "existing project rows: $count"
          if [ "$count" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::task_project (imported) already exists in ${CLOUDFLARE_ENV}. Skipping import."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 単一ユーザー (rin2yh) 専用の importer なので owner / project / user-login は固定。
      # `--owner @me` は viewer.login を使うので owner type 解決の追加 scope を要求しない。
      - name: Fetch GH project items
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p tmp
          gh project item-list 7 \
            --owner @me \
            --format json \
            --limit 1000 \
            > tmp/project-items.json

      # importer は users.login で owner_id を引くので、まだ OAuth ログインしていない環境
      # では "User not found" になる。viewer の databaseId/login で先に INSERT OR IGNORE
      # しておく。OAuth 側は github_id でルックアップするので後で実ログインしても重複しない。
      - name: Bootstrap user row in D1
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          user_json=$(gh api graphql -f query='query { viewer { databaseId login } }')
          gh_id=$(jq -er '.data.viewer.databaseId' <<< "$user_json")
          gh_login=$(jq -er '.data.viewer.login' <<< "$user_json")
          now=$(($(date +%s) * 1000))
          pnpm exec wrangler d1 execute "$D1_NAME" \
            --remote --env "$CLOUDFLARE_ENV" \
            --command "INSERT OR IGNORE INTO users (github_id, login, created_at) VALUES ($gh_id, '$gh_login', $now);"

      - name: Run importer
        if: steps.check.outputs.skip != 'true'
        run: |
          pnpm import:issues \
            --user-login rin2yh \
            --remote \
            --env "$CLOUDFLARE_ENV" \
            --binding "$D1_NAME"
