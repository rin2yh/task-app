name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_cloudflare_api_token }}
  TF_VAR_cloudflare_account_id: ${{ secrets.TF_VAR_cloudflare_account_id }}
  TF_VAR_github_client_id: ${{ secrets.TF_VAR_github_client_id }}
  TF_VAR_github_client_secret: ${{ secrets.TF_VAR_github_client_secret }}
  TF_VAR_session_secret: ${{ secrets.TF_VAR_session_secret }}
  TF_VAR_app_url: ${{ secrets.TF_VAR_app_url }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: terraform fmt -check
        run: terraform fmt -check
      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="endpoints={s3=\"https://${{ secrets.TF_VAR_cloudflare_account_id }}.r2.cloudflarestorage.com\"}"
      - name: terraform validate
        run: terraform validate
      - name: terraform plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const outcome = process.env.PLAN_OUTCOME;
            const stdout = process.env.PLAN_STDOUT || '(no output captured)';
            const truncated = stdout.length > 60000 ? stdout.slice(0, 60000) + '\n…(truncated)' : stdout;
            const body = [
              `### terraform plan (${outcome})`,
              '',
              '```terraform',
              truncated,
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    # R2 backend 移行と Secrets 投入が完了するまで無効化。
    # 完了後は次の条件に置き換えて main push 時のみ apply するよう戻す:
    #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 詳細は docs/cicd.md セクション 3。
    if: false
    needs: [plan]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="endpoints={s3=\"https://${{ secrets.TF_VAR_cloudflare_account_id }}.r2.cloudflarestorage.com\"}"
      - name: terraform apply
        run: terraform apply -auto-approve
