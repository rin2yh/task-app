name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
      - '.github/actions/terraform-init/**'

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: terraform

env:
  TF_IN_AUTOMATION: 'true'
  # Cloudflare 系・OAuth はアカウント共有のため repo secret 配下。
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_github_client_id: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
  TF_VAR_github_client_secret: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
  # SESSION_SECRET / APP_URL は environment(production|develop) ごとに別値。
  # job 側の `environment:` 指定で値が解決される。
  TF_VAR_session_secret: ${{ secrets.SESSION_SECRET }}
  TF_VAR_app_url: ${{ secrets.APP_URL }}
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY は terraform-init action 内で
  # CLOUDFLARE_API_TOKEN から派生する（R2 S3 互換認証は token id と SHA-256(value) で成立）。

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1
      - name: terraform fmt -check
        run: terraform fmt -check

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1
      - name: tflint
        run: tflint --format compact

  plan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: production
            workspace: default
            comment_header: terraform-plan-production
          - environment: develop
            workspace: develop
            comment_header: terraform-plan-develop
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1
      - uses: ./.github/actions/terraform-init
        with:
          bucket: ${{ secrets.CLOUDFLARE_R2_TFSTATE_BUCKET }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: terraform workspace select
        run: terraform workspace select -or-create ${{ matrix.workspace }}
      - name: terraform validate
        run: terraform validate
      - name: terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true
      - name: Read plan output
        id: plan_output
        if: github.event_name == 'pull_request'
        run: |
          # 60KB を超えると GitHub のコメント上限に近づくため切り詰め。
          plan=$(head -c 60000 plan.txt)
          {
            echo 'plan<<EOF'
            echo "$plan"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Upsert plan comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0  # v3.0.4
        with:
          header: ${{ matrix.comment_header }}
          message: |
            ### terraform plan — ${{ matrix.environment }} (${{ steps.plan.outcome }})

            <details><summary>plan output</summary>

            ```terraform
            ${{ steps.plan_output.outputs.plan }}
            ```

            </details>
      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
