name: Deploy preview

# 手動実行のみ。Actions タブの "Deploy preview" → "Run workflow" でブランチを選び、
# 必要なら関連 PR 番号を入れて実行する。PR 番号を渡すとデプロイ後に sticky コメントを書く。
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: '関連 PR 番号（指定するとその PR にコメント）'
        required: false
        type: string

# preview Worker は単一なので、複数の手動実行が重ならないようグローバルにシリアライズする。
concurrency:
  group: preview-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: app

jobs:
  deploy:
    name: Deploy to preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # preview env の vars.APP_URL が空のうちは未 bootstrap とみなしてスキップする。
    if: vars.APP_URL != ''
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: preview
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate:preview
      - run: pnpm build
      # APP_URL は preview env の Variable から流す ([env.preview.vars] には書かない)。
      - run: pnpm exec wrangler deploy --env preview --var "APP_URL:${{ vars.APP_URL }}"
      - name: Write run summary
        run: |
          {
            echo "### Preview deployed"
            echo
            echo "- URL: ${{ vars.APP_URL }}"
            echo "- Ref: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upsert preview comment
        if: inputs.pr_number != ''
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0  # v3.0.4
        with:
          header: preview-deployment
          number: ${{ inputs.pr_number }}
          message: |
            ### Preview deployed

            - URL: ${{ vars.APP_URL }}
            - Ref: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`

            > preview Worker は単一の共有環境です。最後に手動デプロイされた内容が反映されます。
