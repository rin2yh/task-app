name: _deploy

# D1 migrate + Cloudflare Workers deploy を 1 環境ぶん回す再利用 workflow。
# `Web CD` (deploy.yml: push/dispatch) と `PR Deploy` (pr-deploy.yml: PR ボタン) から呼ばれる。
on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (develop or production)
        required: true
        type: string
      ref:
        description: Git ref to checkout. Empty = workflow default ref.
        required: false
        type: string
        default: ''
    outputs:
      url:
        description: Deployed Workers URL
        value: ${{ jobs.deploy.outputs.url }}
      commit_sha:
        description: Commit SHA that was deployed
        value: ${{ jobs.deploy.outputs.commit_sha }}
      commit_message:
        description: Subject line of the deployed commit
        value: ${{ jobs.deploy.outputs.commit_message }}

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      # secret 値と一致する step output は GitHub に redact されて環境 URL に流れない。
      # 公開 URL である APP_URL は GitHub Variables 側で管理する。
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      url: ${{ vars.APP_URL }}
      commit_sha: ${{ steps.commit.outputs.sha }}
      commit_message: ${{ steps.commit.outputs.message }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # @cloudflare/vite-plugin が読む。dist/.../wrangler.json を該当 env
      # 反映で生成しないと、wrangler deploy は top-level config を使ってしまう。
      CLOUDFLARE_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.ref }}
      - name: Capture deployed commit
        id: commit
        run: |
          {
            echo "sha=$(git rev-parse --short HEAD)"
            echo "message=$(git log -1 --pretty=%s)"
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
      # production の D1 名だけ既存リソース互換のため非対称 ("task-app-prod")。
      # migrate を deploy と同ジョブで先に走らせることで、失敗時に build/deploy を自動的にブロックする。
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply task-app-${{ inputs.environment == 'production' && 'prod' || inputs.environment }} --remote --env ${{ inputs.environment }}
      - run: pnpm build
      # secret bulk を deploy 前にやる。新コードが live になる前に最新 secret が揃っている状態を保つ。
      - name: Sync Worker secrets
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          jq -n \
            --arg session_secret "$SESSION_SECRET" \
            --arg app_url "$APP_URL" \
            --arg github_client_id "$GITHUB_CLIENT_ID" \
            --arg github_client_secret "$GITHUB_CLIENT_SECRET" \
            --arg turnstile_secret_key "$TURNSTILE_SECRET_KEY" \
            '{SESSION_SECRET: $session_secret, APP_URL: $app_url, GITHUB_CLIENT_ID: $github_client_id, GITHUB_CLIENT_SECRET: $github_client_secret, TURNSTILE_SECRET_KEY: $turnstile_secret_key}' \
            | pnpm exec wrangler secret bulk --env ${{ inputs.environment }}
      - name: Deploy
        run: pnpm exec wrangler deploy --env ${{ inputs.environment }}
