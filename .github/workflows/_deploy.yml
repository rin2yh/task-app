name: _deploy

# D1 migrate + Cloudflare Workers deploy を 1 環境ぶん回す再利用 workflow。
# `Web CD` (deploy.yml: push/dispatch) と `PR Deploy` (pr-deploy.yml: PR ボタン) から呼ばれる。
on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (develop or production)
        required: true
        type: string
      ref:
        description: Git ref to checkout. Empty = workflow default ref.
        required: false
        type: string
        default: ''
    outputs:
      url:
        description: Deployed Workers URL
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  migrate-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    concurrency:
      group: migrate-db-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup
      # production の D1 名だけ既存リソース互換のため非対称 ("task-app-prod")。
      - run: pnpm exec wrangler d1 migrations apply task-app-${{ inputs.environment == 'production' && 'prod' || inputs.environment }} --remote --env ${{ inputs.environment }}

  deploy:
    needs: migrate-db
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # @cloudflare/vite-plugin が読む。dist/.../wrangler.json を該当 env
      # 反映で生成しないと、wrangler deploy は top-level config を使ってしまう。
      CLOUDFLARE_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup
      - run: pnpm build
      # secret bulk を deploy 前にやる。新コードが live になる前に最新 secret が揃っている状態を保つ。
      - name: Sync Worker secrets
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
        run: |
          jq -n \
            --arg session_secret "$SESSION_SECRET" \
            --arg app_url "$APP_URL" \
            --arg github_client_id "$GITHUB_CLIENT_ID" \
            --arg github_client_secret "$GITHUB_CLIENT_SECRET" \
            '{SESSION_SECRET: $session_secret, APP_URL: $app_url, GITHUB_CLIENT_ID: $github_client_id, GITHUB_CLIENT_SECRET: $github_client_secret}' \
            | pnpm exec wrangler secret bulk --env ${{ inputs.environment }}
      - name: Deploy
        id: deploy
        # GitHub Deployments の URL 欄に表示するため、wrangler 出力から
        # workers.dev URL を抜き出して step output に流す。
        run: |
          pnpm exec wrangler deploy --env ${{ inputs.environment }} 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          if [ -z "$url" ]; then
            echo "::warning::Could not parse deploy URL from wrangler output"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
