name: Setup E2E
description: Cache Playwright browsers, install Playwright + chromium, stage .dev.vars and apply local D1 migrations. Run after ./.github/actions/setup.

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: playwright-version
      shell: bash
      working-directory: app
      run: echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-${{ steps.playwright-version.outputs.version }}
    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: app
      run: pnpm exec playwright install --with-deps chromium
    - name: Install Playwright system deps
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      working-directory: app
      run: pnpm exec playwright install-deps chromium
    - name: Stage .dev.vars for E2E
      shell: bash
      working-directory: app
      run: cp .dev.vars.example .dev.vars
    - name: Apply D1 migrations (local)
      shell: bash
      working-directory: app
      run: pnpm migrate
