name: Resolve develop D1 database ID
description: |
  develop の D1 database_id は terraform 側 state にしか無く wrangler.toml には placeholder
  (00000000-...) が入っている。Cloudflare API から実 UUID を引いて wrangler.toml を上書きする。
  job-level env で CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID を渡してから呼ぶこと。

inputs:
  database-name:
    description: D1 database name to resolve
    required: false
    default: task-app-develop

runs:
  using: composite
  steps:
    - name: Patch wrangler.toml with resolved develop database_id
      shell: bash
      working-directory: app
      env:
        DATABASE_NAME: ${{ inputs.database-name }}
      run: |
        set -euo pipefail
        DB_ID=$(pnpm exec wrangler d1 list --json | jq -r --arg name "$DATABASE_NAME" '.[] | select(.name == $name) | .uuid')
        if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
          echo "ERROR: D1 database '$DATABASE_NAME' not found on Cloudflare. Run terraform-apply for the develop workspace first." >&2
          exit 1
        fi
        echo "Resolved $DATABASE_NAME to $DB_ID"
        sed -i "s/database_id = \"00000000-0000-0000-0000-000000000000\"/database_id = \"$DB_ID\"/g" wrangler.toml
