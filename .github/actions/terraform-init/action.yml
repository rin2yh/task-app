name: Terraform init (Cloudflare R2 backend)
description: Run terraform init with R2 (S3-compatible) backend config.

inputs:
  bucket:
    description: R2 bucket holding tfstate
    required: true
  account-id:
    description: Cloudflare account id (used to build the R2 endpoint URL)
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: terraform
      run: |
        terraform init \
          -backend-config="bucket=${{ inputs.bucket }}" \
          -backend-config="endpoints={s3=\"https://${{ inputs.account-id }}.r2.cloudflarestorage.com\"}"
