name = "task-app"
main = "server/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

assets = { directory = "./dist/client", binding = "ASSETS" }

[[d1_databases]]
binding = "DB"
database_name = "task-app-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "./server/db/migrations"

[triggers]
crons = ["0 3 * * *"]

[env.production]
name = "task-app"

[[env.production.d1_databases]]
binding = "DB"
database_name = "task-app-prod"
database_id = "3605a196-43db-4276-adc9-61ef66dca5ab"
migrations_dir = "./server/db/migrations"

[env.develop]
name = "task-app-develop"

[[env.develop.d1_databases]]
binding = "DB"
database_name = "task-app-develop"
# TODO: terraform workspace=develop の初回 apply 後に出力 d1_database_id を貼り付ける。
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "./server/db/migrations"
